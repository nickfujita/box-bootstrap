# Agent windows (a pane running claude or codex) take their name from the
# chat's native session title. session-titles.service mirrors that title into
# the @session_title and @session_repo pane options; other windows keep the
# running command. Option values are expanded once, so never wrap the title in
# E: or #(). A manual rename-window still pins that window's name, as usual.
set -gw automatic-rename on
set -gw automatic-rename-format '#{?#{||:#{==:#{pane_current_command},codex},#{==:#{pane_current_command},claude}},#{?@session_title,#{=/28/…:@session_title},#{=/28/…:pane_title}},#{pane_current_command}}'
# Right side: `task title | repository` for an agent window, otherwise the
# reference status bar's `branch | folder`.
set -g status-right-length 80
set -g status-right ' #[fg=#dba3c4]#{?#{||:#{==:#{pane_current_command},codex},#{==:#{pane_current_command},claude}},#{?@session_title,#{@session_title},#{pane_title}} #[fg=#666666]| #[fg=#dba3a2]#{?@session_repo,#{@session_repo},#{b:pane_current_path}},#(cd #{pane_current_path}; git branch --show-current 2>/dev/null || echo "--")#[fg=#666666] | #[fg=#dba3a2]#(basename "#{pane_current_path}")} '
