model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"

[agents]
enabled = true
max_concurrent_threads_per_session = 6
# Keep workers from recursively delegating. The reconciliation skill verifies
# that the installed Codex version accepts this compatibility key.
max_depth = 1
# Fail-safe defaults if a spawn omits routing (per-spawn fields can be
# hidden from a Sol parent): bounded-work tier, not another Sol.
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "xhigh"
